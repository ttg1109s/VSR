name: VSR headless quality

on:
  push:
    branches:
      - engine-only
      - chore/remove-ui-keep-react-engine
  pull_request:
    branches:
      - engine-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run schema:check
      - run: npm test
      - run: npm run audit:state:strict
      - run: npm run check:server
      - run: npm run build
