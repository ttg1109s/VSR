name: VSR headless quality

on:
  push:
    branches:
      - chore/remove-ui-keep-react-engine
      - remediation/full-audit-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vsr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run schema:check
      - run: npm run check:server
      - run: npm run audit:ui
      - run: npm run audit:safe-area
      - run: npm run audit:deadcode
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm test
      - run: npm run audit:state:strict
