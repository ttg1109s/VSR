name: Engine headless tests

on:
  push:
    branches: [patch]
  pull_request:
    branches: [patch]
  workflow_dispatch:

jobs:
  node-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
