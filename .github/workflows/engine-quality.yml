name: Engine quality

on:
  workflow_call:
  push:
    branches: [engine-only, ui-rebuild, feature/restore-password-domain, feature/schema-as-source-of-truth, audit/remediation-and-deadcode-cleanup, remediation/full-audit-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: engine-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json is not tracked in this repository yet. Keep npm
      # install until a lockfile can be reviewed and committed.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run schema:check
      - run: npm run check:server
      - run: npm run audit:ui
      - run: npm run audit:safe-area
      - run: npm run audit:deadcode
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm test
      - run: npm run audit:state:strict
