name: Engine quality

on:
  push:
    branches: [engine-only, feature/restore-password-domain, feature/schema-as-source-of-truth]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run schema:check
      - run: npm run build
      - run: npm run check:server
      - run: npm test
      - run: npm run audit:state:strict
