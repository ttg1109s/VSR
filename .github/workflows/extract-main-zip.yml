name: Extract main.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract archive into repository root
        shell: bash
        run: |
          set -euo pipefail

          archive="main.zip"
          test -f "$archive" || {
            echo "::error::main.zip was not found at the repository root."
            exit 1
          }

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          unzip -q "$archive" -d "$tmp/unpacked"

          # Strip exactly one wrapper directory when the archive has a
          # single top-level directory and no top-level files.
          mapfile -t top_entries < <(find "$tmp/unpacked" -mindepth 1 -maxdepth 1 -printf '%f\n')
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "$tmp/unpacked/${top_entries[0]}" ]; then
            source_dir="$tmp/unpacked/${top_entries[0]}"
          else
            source_dir="$tmp/unpacked"
          fi

          # Overlay extracted files onto the checkout, replacing collisions.
          # Preserve repository metadata and the source archive/workflow files.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='main.zip' \
            "$source_dir/" ./

          # Remove the archive only after extraction and overlay succeeded.
          rm -f "$archive"

      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract main.zip into repository root"
          git push
