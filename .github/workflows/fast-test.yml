name: Fast test

on:
  push:
    branches: [engine-only]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run schema:check
      - run: npm run check:server
      - run: npm test
