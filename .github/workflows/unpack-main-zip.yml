name: Unpack main.zip into repository root

on:
  push:
    branches: [main]
    paths:
      - main.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-main-zip-main
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Safely unpack root main.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import shutil
          import stat
          import zipfile

          workspace = pathlib.Path.cwd().resolve()
          archive = workspace / "main.zip"
          extract = pathlib.Path("/tmp/main-zip-extract")
          if extract.exists():
              shutil.rmtree(extract)
          extract.mkdir(parents=True)

          if not archive.is_file():
              raise SystemExit("Expected main.zip at repository root")
          if not zipfile.is_zipfile(archive):
              raise SystemExit("main.zip is not a valid ZIP archive")

          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              files = [e for e in entries if not e.is_dir()]
              if not files:
                  raise SystemExit("ZIP contains no files")
              if len(files) > 10000:
                  raise SystemExit("ZIP contains too many files")
              if sum(e.file_size for e in files) > 1_000_000_000:
                  raise SystemExit("ZIP uncompressed size exceeds 1 GB limit")

              for info in entries:
                  name = info.filename.replace("\\", "/")
                  path = pathlib.PurePosixPath(name)
                  mode = info.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or (path.parts and ":" in path.parts[0]):
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink entry not allowed: {info.filename}")
              zf.extractall(extract)

          extracted_files = [p for p in extract.rglob("*") if p.is_file()]
          roots = {p.relative_to(extract).parts[0] for p in extracted_files}
          top_files = [p for p in extracted_files if len(p.relative_to(extract).parts) == 1]
          if len(roots) == 1 and not top_files:
              candidate = extract / next(iter(roots))
              source_root = candidate if candidate.is_dir() else extract
          else:
              source_root = extract

          # Replace repository contents but preserve Git metadata and workflows.
          for child in workspace.iterdir():
              if child.name in {".git", ".github"}:
                  continue
              if child.is_dir() and not child.is_symlink():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          for child in source_root.iterdir():
              if child.name in {".git", ".github", "main.zip"}:
                  continue
              target = workspace / child.name
              if child.is_dir():
                  shutil.copytree(child, target, symlinks=False)
              else:
                  shutil.copy2(child, target)

          print(f"Imported {len(extracted_files)} files from root main.zip.")
          print(f"Wrapper directory stripped: {source_root != extract}")
          PY

      - name: Commit imported contents
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import main.zip contents"
          git push origin main
