         tạo thêm 1 vòng round-trip tuần tự (HTML -> fetch CSS -> phát hiện
         @import -> fetch CSS thật của Google Fonts -> phát hiện url font ->
         fetch .woff2) trước khi font icon bắt đầu tải — trên mạng di động dễ
         vượt quá "block period" ngắn của display=block, khiến ligature hiện chữ
         thô ("auto_stories", "arrow_forward"...) thay vì icon. preconnect giúp
         trình duyệt mở kết nối tới 2 domain của Google Fonts sớm, song song với
         lúc HTML đang parse, thay vì đợi phát hiện qua @import mới bắt đầu mở. -->

    <!-- ==================== PRELOADER & LOADER CHECK ==================== -->
    <script>
        // Preloader kiểu launcher OS (#app-preloader, xem đầu <body>) — che toàn màn
        // hình và chặn mọi click cho tới khi app.js load xong, để không còn tình
        // huống bấm nút lúc window.app/ui/engine chưa tồn tại (import module ES
        // chưa chạy xong) gây runtime error.
        function hideAppPreloader() {
            const el = document.getElementById('app-preloader');
            if (!el) return;
            el.style.transition = 'opacity .3s ease';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            setTimeout(() => el.remove(), 300);
        }

        function showAppPreloaderError() {
            const el = document.getElementById('app-preloader');
            if (!el) return;
            el.innerHTML = `
                <span class="material-icons-round text-4xl text-red-500">error_outline</span>
                <p class="text-sm font-bold" style="color:var(--vsr-ink-900,#292524)">Tải ứng dụng thất bại</p>
                <p class="text-xs text-center px-10" style="color:var(--vsr-ink-400,#a8a29e)">Kiểm tra kết nối mạng rồi thử tải lại trang.</p>
                <button onclick="location.reload()"
                    class="mt-2 px-5 py-2 rounded-full bg-red-600 text-white text-xs font-bold uppercase tracking-wide">Tải lại</button>
            `;
        }

        // Preloader: Check if all imports are loaded
        window._loadStatus = {
            scriptLoaded: false,
            appLoaded: false,
            errors: []
        };

        // Cảnh báo sớm nếu đang mở qua file:// — ES module (type="module") sẽ bị
        // trình duyệt chặn bởi CORS khi chạy qua file://, trong khi script thường
        // (demo_script.js) vẫn chạy bình thường. Đây là nguyên nhân kinh điển khiến
        // "DEMO_SCRIPT loaded" hiện ra nhưng app module không bao giờ load.
        if (location.protocol === 'file:') {
            console.error('⚠️ Đang chạy qua file:// — ES module (app.js) sẽ KHÔNG load được do bị chặn CORS. Cần chạy qua HTTP server (vd: python3 -m http.server, VSCode Live Server) rồi mở qua http://localhost.');
        }

        // Catch unhandledrejection for module errors
        window.addEventListener('unhandledrejection', (event) => {
            console.error('[UNHANDLED PROMISE REJECTION]', event.reason);
            window._loadStatus.errors.push(`❌ Unhandled Promise Rejection: ${event.reason?.message || event.reason}`);
        });

        // Catch mọi lỗi script (bỏ bộ lọc theo nội dung message — bộ lọc cũ khiến
        // các lỗi không chứa đúng vài từ khoá bị bỏ sót hoàn toàn, kể cả lỗi thật).
        window.addEventListener('error', (event) => {
            const msg = event.message || '(no message — có thể là lỗi tải resource)';
            console.error('[ERROR]', msg, '@', event.filename || '(unknown file)', ':', event.lineno ?? '?');
            window._loadStatus.errors.push(`❌ ${msg} @ ${event.filename || '?'}:${event.lineno ?? '?'}`);
        });

        // Lỗi tải resource (script/link 404, CORS bị chặn...) không bubble lên,
        // nên phải bắt ở CAPTURE PHASE tại window mới thấy được — đây thường là
        // chỗ lỗi thật của "type=module bị chặn CORS" ẩn nấp mà bộ bắt lỗi cũ bỏ sót.
        window.addEventListener('error', (event) => {
            const t = event.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && !(event instanceof ErrorEvent)) {
                const src = t.src || t.href || '(unknown)';
                console.error('[RESOURCE LOAD ERROR]', t.tagName, src);
                window._loadStatus.errors.push(`❌ Không tải được resource: ${src}`);
            }
        }, true);

        window.addEventListener('load', () => {
            // demo_script.js should be loaded
            if (typeof DEMO_SCRIPT === 'undefined') {
                window._loadStatus.errors.push('❌ DEMO_SCRIPT not loaded - check demo_script.js');
            } else {
                window._loadStatus.scriptLoaded = true;
                console.log('✓ DEMO_SCRIPT loaded');
            }

            // Check app.js module loading (with timeout)
            const checkAppLoad = setInterval(() => {
                if (window.app && window.ui && window.engine && window.API) {
                    window._loadStatus.appLoaded = true;
                    clearInterval(checkAppLoad);
                    console.log('✓ App module loaded');
                    hideAppPreloader();

                    if (window._loadStatus.errors.length === 0) {
                        console.log('✅ ALL MODULES LOADED SUCCESSFULLY');
                    } else {
                        console.error('⚠️ LOAD WARNINGS:', window._loadStatus.errors);
                    }
                }
            }, 50);

            // Timeout: if app not loaded after 5 seconds
            setTimeout(() => {
                if (!window._loadStatus.appLoaded) {
                    window._loadStatus.errors.push('❌ App module failed to load within 5 seconds');
                    console.error('FATAL: Module loading timeout', window._loadStatus);
                    document.getElementById('debug-toggle').classList.add('error');
                    document.getElementById('debug-console').style.display = 'block';
                    showAppPreloaderError();

                    // Log all errors
                    window._loadStatus.errors.forEach(err => {
                        console.error(err);
                    });
                }
            }, 5000);
        });
    </script>

    <script>
    (function(){

    const toggle=document.getElementById("debug-toggle");
    const panel=document.getElementById("debug-console");
    const body=document.getElementById("debug-body");

    toggle.onclick=()=>{

    panel.style.display=
    panel.style.display==="block"
    ?"none"
    :"block";

    };

    document.getElementById("debug-hide").onclick=()=>{

    panel.style.display="none";

    };

    document.getElementById("debug-clear").onclick=()=>{

    body.innerHTML="";

    };

    const copyBtn=document.getElementById("debug-copy");

    copyBtn.onclick=()=>{

    const text=Array.from(body.querySelectorAll(".log-entry"))
    .map(el=>el.innerText)
    .join("\n");

    const done=()=>{
    const old=copyBtn.textContent;
    copyBtn.textContent="Copied!";
    setTimeout(()=>{ copyBtn.textContent=old; },1200);
    };

    const fallback=()=>{
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ console.error("Copy failed",e); }
    document.body.removeChild(ta);
    };

    if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
    fallback();
    }

    };

    function stringify(v){

    if(v instanceof Error)
    return v.stack||v.message;

    if(typeof v==="object"){

    try{
    return JSON.stringify(v,null,2);
    }
    catch{
    return "[Object]";
    }

    }

    return String(v);

    }

    function append(type,args){

    const div=document.createElement("div");

    div.className="log-entry "+type;

    const t=new Date().toLocaleTimeString();

    div.innerHTML=
    '<span class="time">'+t+'</span>'+
    args.map(stringify).join(" ");

    body.appendChild(div);

    body.scrollTop=body.scrollHeight;

    if(type==="error"){

    toggle.classList.add("error");

    panel.style.display="block";

    }

    }

    ["log","info","warn","error","debug"].forEach(fn=>{

    const old=console[fn];

    console[fn]=(...args)=>{

    append(fn,args);

    old.apply(console,args);

    };

    });

    window.addEventListener("error",e=>{

    append("error",[
    e.message,
    "\n"+e.filename+":"+e.lineno+":"+e.colno,
    "\n",
    e.error||""
    ]);

    });

    window.addEventListener("unhandledrejection",e=>{

    append("error",[
    "Unhandled Promise Rejection",
    "\n",
    e.reason
    ]);

    });

    let drag=false;
    let sx=0;
    let sy=0;
    let px=0;
    let py=0;

    const header=document.getElementById("debug-header");

    header.addEventListener("mousedown",e=>{

    drag=true;

    sx=e.clientX;
    sy=e.clientY;

    const rect=panel.getBoundingClientRect();

    px=rect.left;
    py=rect.top;

    panel.style.left=px+"px";
    panel.style.top=py+"px";
    panel.style.right="auto";
    panel.style.bottom="auto";

    });

    document.addEventListener("mousemove",e=>{

    if(!drag) return;

    panel.style.left=
    (px+e.clientX-sx)+"px";

    panel.style.top=
    (py+e.clientY-sy)+"px";

    });

    document.addEventListener("mouseup",()=>{

    drag=false;

    });

    })();
    </script>
