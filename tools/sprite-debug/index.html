<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSR Sprite Debugger</title><style>body{font:14px system-ui;margin:20px;background:#111;color:#eee}textarea{width:100%;height:180px;background:#222;color:#eee}button{padding:8px 14px;margin:8px 0}canvas{width:100%;height:440px;background:#181818;border:1px solid #444;display:block;margin-bottom:12px}pre{white-space:pre-wrap;background:#222;padding:10px;max-height:240px;overflow:auto}h2{font-size:16px}</style><h1>VSR Sprite Debugger</h1><p>Paste failure snapshot, replay bundle, or simulation diagnostics JSON. Local-only; no data is uploaded.</p><textarea id="input" placeholder="Paste JSON"></textarea><button id="render">Render diagnostics</button><h2>Collision / geometry view</h2><canvas id="scene" width="1200" height="440"></canvas><h2>Trajectory timeline</h2><canvas id="timeline" width="1200" height="440"></canvas><pre id="output"></pre><script>
const input=document.querySelector('#input'),scene=document.querySelector('#scene'),timeline=document.querySelector('#timeline'),out=document.querySelector('#output'),sctx=scene.getContext('2d'),tctx=timeline.getContext('2d');
function bodyList(d){const r=d.runtime||d.input?.runtime||d.input||{};return r.bodies||r.sprites||d.bodies||d.input?.bodies||[];}
function normalizeBodies(v){if(Array.isArray(v))return v;if(v&&typeof v==='object')return Object.entries(v).map(([id,b])=>({id,...b}));return[];}
function drawScene(d){sctx.clearRect(0,0,scene.width,scene.height);sctx.fillStyle='#ddd';sctx.fillText('Top-down geometry / collider preview (body positions and shape descriptors required in snapshot)',12,18);const bodies=normalizeBodies(bodyList(d));const points=bodies.map(b=>b.position||b.transform?.position).filter(p=>Array.isArray(p));if(!points.length){sctx.fillStyle='#888';sctx.fillText('No body geometry in snapshot. Timeline remains available.',12,40);return;}const minX=Math.min(...points.map(p=>p[0])),maxX=Math.max(...points.map(p=>p[0])),minY=Math.min(...points.map(p=>p[1])),maxY=Math.max(...points.map(p=>p[1])),scale=Math.min(1000/Math.max(maxX-minX,1),350/Math.max(maxY-minY,1)),map=p=>[100+(p[0]-minX)*scale,220+(p[1]-minY)*scale];const colors=['#67d4ff','#ffbf69','#b7f27a','#ff8aa1','#b6a0ff'];bodies.forEach((b,i)=>{const p=b.position||b.transform?.position;if(!Array.isArray(p))return;const[x,y]=map(p);sctx.strokeStyle=sctx.fillStyle=colors[i%colors.length];sctx.lineWidth=2;const c=b.collider||b.shape||{};if(c.type==='circle'||(!c.type&&Number.isFinite(b.radius))){sctx.beginPath();sctx.arc(x,y,(c.radius||b.radius||5)*scale,0,Math.PI*2);sctx.stroke();}else if(c.type==='box'){const w=c.width*scale,h=c.height*scale;sctx.strokeRect(x-w/2,y-h/2,w,h);}else if(c.type==='polygon'&&Array.isArray(c.vertices)){sctx.beginPath();c.vertices.forEach((q,j)=>{const z=map([p[0]+q[0],p[1]+q[1]]);j?sctx.lineTo(...z):sctx.moveTo(...z)});sctx.closePath();sctx.stroke();}else{sctx.beginPath();sctx.arc(x,y,5,0,Math.PI*2);sctx.fill();}sctx.fillText(b.id||b.spriteId||`body-${i}`,x+8,y-8);if(b.sweptBounds||b.bounds){const q=b.sweptBounds||b.bounds;sctx.strokeStyle='#999';sctx.setLineDash([5,4]);sctx.strokeRect(map(q.min)[0],map(q.min)[1],(q.max[0]-q.min[0])*scale,(q.max[1]-q.min[1])*scale);sctx.setLineDash([]);}});}
function drawTimeline(d){tctx.clearRect(0,0,timeline.width,timeline.height);const sim=d.simulation||d,events=sim.collisions||sim.events?.filter(e=>e.kind==='collision')||[],segs=sim.segments||[],start=sim.startTime??0,end=sim.endTime??1,span=Math.max(end-start,1e-9);tctx.strokeStyle='#888';tctx.beginPath();tctx.moveTo(50,30);tctx.lineTo(50,400);tctx.lineTo(1150,400);tctx.stroke();tctx.fillStyle='#ddd';tctx.fillText('time '+start,50,420);tctx.fillText('time '+end,1100,420);const colors=['#67d4ff','#ffbf69','#b7f27a','#ff8aa1','#b6a0ff'];const list=Array.isArray(segs)?segs:[Object.entries(segs)];list.forEach(([id,ss],i)=>{const y=65+i*35;tctx.fillStyle=colors[i%colors.length];tctx.fillText(id,8,y+5);(ss||[]).forEach(s=>{const x=50+(s.startTime-start)/span*1100,w=(s.endTime-s.startTime)/span*1100;tctx.fillRect(x,y-9,Math.max(w,2),18);tctx.fillText(s.type,x+3,y+4);});});events.forEach((e,i)=>{const t=e.time??e.startTime??start,x=50+(t-start)/span*1100;tctx.strokeStyle='#ff4444';tctx.beginPath();tctx.moveTo(x,30);tctx.lineTo(x,400);tctx.stroke();tctx.fillStyle='#ffaaaa';tctx.fillText((e.spriteA||e.bodyId||'')+' '+(e.spriteB||''),x+4,40+i*12);});}
document.querySelector('#render').onclick=()=>{let d;try{d=JSON.parse(input.value)}catch(e){out.textContent='JSON invalid: '+e.message;return;}drawScene(d);drawTimeline(d);out.textContent=JSON.stringify(d,null,2);};</script></html>
